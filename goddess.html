.intro-content { display: flex; gap: 24px; align-items: flex-start; width: 100%; max-width: 1320px; margin: 0 auto; }
.intro-left { width: 200px; flex: none; }
.intro-left .section-title { text-align: left; margin-bottom: 4px; }
.intro-left .section-sub { text-align: left; margin-bottom: 22px; }
.classify-box { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; }
.classify-box li {
  display: flex; align-items: center; gap: 8px; list-style: none;
  padding: 6px 22px 6px 12px; font-size: 16px;
  color: #888; background: #fff; border: 1px solid #c8cdd6;
  border-radius: 30px 0 0 30px; cursor: pointer;
}
.classify-box li:hover { color: #1a1a1a; }
.classify-box li.active { color: #fff; background: #1a1a1a; border-color: #1a1a1a; }
.classify-box li .dot { width: 22px; height: 22px; border-radius: 50%; background: #9aa3b2; flex: none; }
.classify-box li.active .dot { background: #fff; }
.char-stage { display: flex; gap: 24px; align-items: flex-start; flex: 1; min-width: 0; }
.char-art { width: 460px; height: 600px; flex: none; transition: transform .35s ease, opacity .35s ease; }
.char-art.slide-out-left { transform: translateX(-60px); opacity: 0; }
.char-art.slide-out-right { transform: translateX(60px); opacity: 0; }
.char-info-col { flex: 1; min-width: 0; padding-top: 8px; }
.char-name { font-size: 36px; font-weight: 700; margin-bottom: 16px; min-height: 48px; }
.char-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; min-height: 32px; }
.char-tags span { font-size: 14px; color: #666; background: #fff; border: 1px solid #c8cdd6; padding: 5px 18px; border-radius: 40px; }
.char-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: #666; min-height: 20px; }
.char-meta span { color: #444; white-space: nowrap; }
.char-desc { font-size: 15px; color: #555; line-height: 2; margin-bottom: 24px; height: 180px; overflow-y: auto; background: #fff; border: 1px solid #c8cdd6; border-radius: 8px; padding: 16px 18px; }
.char-carousel { display: flex; align-items: center; gap: 14px; margin-top: 28px; justify-content: center; }
.arr-btn { width: 44px; height: 44px; border-radius: 50%; flex: none; background: #fff; border: 1px solid #c8cdd6; color: #1a1a1a; font-size: 20px; cursor: pointer; line-height: 1; }
.arr-btn:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.arr-btn:disabled { opacity: .3; cursor: default; }
.arr-btn:disabled:hover { background: #fff; color: #1a1a1a; border-color: #c8cdd6; }
.avatar-strip { display: flex; gap: 20px; align-items: center; flex: none; transition: transform .2s ease, opacity .2s ease; }
.avatar-strip.strip-slide-left { transform: translateX(-28px); opacity: 0; }
.avatar-strip.strip-slide-right { transform: translateX(28px); opacity: 0; }
.avatar-strip .slot { width: 84px; height: 84px; flex: none; transition: all .25s ease; }
.avatar-strip .slot.cur { border: 2px solid #c00a2f; transform: scale(1.12); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.avatar-strip .slot.side { opacity: .35; filter: grayscale(100%); transform: scale(.86); }
.avatar-empty { width: 84px; height: 84px; flex: none; }
#page-goddess .section { justify-content: flex-start; }
</style>

<script>
/* 角色数据：8 个分类，各分类角色数不同 */
var PANTHEONS = ['greek', 'norse', 'korean', 'chinese', 'japanese', 'hebrew', 'egyptian', 'celestial'];
var CHAR_COUNTS = [4, 4, 3, 4, 4, 4, 4, 4];
var CHAR_TAGS = ['【角色阵营】', '【角色性格1】', '【角色性格2】', '【角色性格3】'];
var CHAR_META = '【MBTI 人格】 / 【身高】cm / B·W·H【三围】';
var curPantheon = 'greek';
var curIdx = 0;

function renderStage() {
  var stage = document.getElementById('charStage');
  var panIdx = PANTHEONS.indexOf(curPantheon);
  var len = CHAR_COUNTS[panIdx];
  var panNo = panIdx + 1;
  var name = '【分类' + panNo + ' · 角色' + (curIdx + 1) + ' 名称】';
  var desc = '【分类' + panNo + ' · 角色' + (curIdx + 1) + ' 简介文案】';
  var tags = '';
  for (var j = 0; j < CHAR_TAGS.length; j++) { tags += '<span>' + CHAR_TAGS[j] + '</span>'; }

  var avatars = '';
  for (var i = curIdx - 1; i <= curIdx + 1; i++) {
    if (i < 0 || i >= len) { avatars += '<div class="avatar-empty"></div>'; }
    else {
      var cls = (i === curIdx) ? 'cur' : 'side';
      avatars += '<div class="slot ' + cls + '" data-idx="' + i + '"><div class="slot-name">角色 ' + (i + 1) + ' 头像</div></div>';
    }
  }

  stage.innerHTML =
    '<div class="char-art"><div class="slot" style="width:100%;height:100%;"><div class="slot-name">角色 ' + (curIdx + 1) + ' 立绘</div><div class="slot-src">随角色切换</div></div></div>'
    + '<div class="char-info-col">'
    + '<div class="char-name">' + name + '</div>'
    + '<div class="char-tags">' + tags + '</div>'
    + '<div class="char-meta"><span>' + CHAR_META + '</span></div>'
    + '<div class="char-desc">' + desc + '</div>'
    + '<div class="char-carousel">'
    + '<button class="arr-btn" id="prevBtn" aria-label="上一个角色">‹</button>'
    + '<div class="avatar-strip">' + avatars + '</div>'
    + '<button class="arr-btn" id="nextBtn" aria-label="下一个角色">›</button>'
    + '</div>'
    + '</div>';

  var prev = document.getElementById('prevBtn');
  var next = document.getElementById('nextBtn');
  prev.disabled = (curIdx === 0);
  next.disabled = (curIdx === len - 1);
  prev.onclick = function() { switchChar(curIdx - 1); };
  next.onclick = function() { switchChar(curIdx + 1); };
}

function switchChar(idx) {
  var len = CHAR_COUNTS[PANTHEONS.indexOf(curPantheon)];
  if (idx < 0 || idx >= len || idx === curIdx) return;
  var art = document.querySelector('.char-art');
  var strip = document.querySelector('.avatar-strip');
  art.classList.add('slide-out-right');
  if (strip) strip.classList.add('strip-slide-right');
  setTimeout(function() { curIdx = idx; renderStage(); }, 200);
}

document.getElementById('charStage').addEventListener('click', function(e) {
  var slot = e.target.closest('.slot[data-idx]');
  if (slot) { switchChar(parseInt(slot.getAttribute('data-idx'), 10)); }
});

document.getElementById('godTabs').addEventListener('click', function(e) {
  var li = e.target.closest('li[data-pantheon]');
  if (!li) return;
  var tabs = document.querySelectorAll('#godTabs li');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove('active'); }
  li.classList.add('active');
  curPantheon = li.getAttribute('data-pantheon');
  var maxIdx = CHAR_COUNTS[PANTHEONS.indexOf(curPantheon)] - 1;
  if (curIdx > maxIdx) { curIdx = maxIdx; }
  renderStage();
});

renderStage();

document.querySelectorAll('.float-prereg').forEach(function(f){
  f.addEventListener('submit', function(e){ e.preventDefault(); window.location.href='thanks.html'; });
});
</script>
