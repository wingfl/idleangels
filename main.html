<script>
/* 首页宣传视频弹框 */
var playBtn = document.getElementById('playBtn');
var modal = document.getElementById('videoModal');
playBtn.addEventListener('click', function(){ modal.classList.add('open'); });
document.getElementById('modalClose').addEventListener('click', function(){ modal.classList.remove('open'); });
modal.addEventListener('click', function(e){ if (e.target === this) this.classList.remove('open'); });
/* 提交跳转（demo 模拟） */
document.querySelectorAll('.prereg-block').forEach(function(f){
  f.addEventListener('submit', function(e){ e.preventDefault(); window.location.href='thanks.html'; });
