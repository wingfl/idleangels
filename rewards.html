// 奖励数据（待游戏方补充：名称/内容/图标位/项数）。数组为空时显示占位卡。
var rewards = [
  // { name: '事前登录特典礼包', desc: '上线后自动发放', img: '奖励主图占位' }
];
var wrap = document.getElementById('rewardWrap');
if (rewards.length === 0) {
  wrap.innerHTML = '<div class="reward-card solo">'
    + '<div class="rv-img">奖励主图占位</div>'
    + '<div class="rv-body"><div class="rv-name">奖励名【待补充】</div>'
    + '<div class="rv-desc">奖励内容说明【待补充】</div></div></div>';
} else {
  var html = '';
  rewards.forEach(function(r, i){
    html += '<div class="reward-card' + (i === 0 ? ' solo' : '') + '">'
      + '<div class="rv-img">' + (r.img || r.name) + '</div>'
      + '<div class="rv-body"><div class="rv-name">' + r.name + '</div>'
      + '<div class="rv-desc">' + r.desc + '</div></div></div>';
  });
  wrap.innerHTML = html;
}
