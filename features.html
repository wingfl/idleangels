<script>
/* 游戏特征：大图无缝轮播（克隆首尾实现无限循环） */
var FEATURE_COUNT = 5;
var FEAT_STEP = 660;
var featPos = 1;
var featBusy = false;
var FEAT_ORDER = [4, 0, 1, 2, 3, 4, 0];

function featRender() {
  var row = document.getElementById('featRow');
  var cards = '';
  for (var i = 0; i < FEAT_ORDER.length; i++) {
    var r = FEAT_ORDER[i];
    cards += '<div class="feat-card" data-real="' + r + '">'
      + '<div class="feat-shot"><div class="slot" style="width:100%;height:100%;">'
      + '<div class="slot-name">卖点 ' + (r + 1) + ' 实机图</div>'
      + '<div class="slot-src">游戏实机截图</div></div></div>'
      + '</div>';
  }
  row.innerHTML = cards;
}
function featOffset() {
  var vp = document.querySelector('.feature-viewport');
  return Math.max((vp.clientWidth - 640) / 2, 0);
}
function featApplyTransform(animate) {
  var row = document.getElementById('featRow');
  row.style.transition = animate ? '' : 'none';
  row.style.transform = 'translateX(' + (featOffset() - featPos * FEAT_STEP) + 'px)';
  if (!animate) { void row.offsetWidth; }
}
function featActiveReal() {
  if (featPos === 0) return 4;
  if (featPos === 6) return 0;
  return featPos - 1;
}
function featUpdate() {
  var real = featActiveReal();
  var cards = document.querySelectorAll('#featRow .feat-card');
  for (var i = 0; i < cards.length; i++) {
    var r = parseInt(cards[i].getAttribute('data-real'), 10);
    if (r === real) { cards[i].classList.add('active'); }
    else { cards[i].classList.remove('active'); }
  }
  document.getElementById('ftName').textContent = '【卖点 ' + (real + 1) + ' 标题】';
  document.getElementById('ftDesc').textContent = '【卖点 ' + (real + 1) + ' 说明文案】';
}
function featGo(dir) {
  if (featBusy) return;
  featBusy = true;
  featPos += dir;
  featUpdate();
  featApplyTransform(true);
  setTimeout(function() {
    if (featPos === 6) { featPos = 1; featApplyTransform(false); }
    else if (featPos === 0) { featPos = 5; featApplyTransform(false); }
    featUpdate();
    featBusy = false;
  }, 520);
}
document.getElementById('featPrev').addEventListener('click', function() { featGo(-1); });
document.getElementById('featNext').addEventListener('click', function() { featGo(1); });
featRender();
featApplyTransform(false);
featUpdate();
window.addEventListener('resize', function() { featApplyTransform(false); });

document.querySelectorAll('.float-prereg').forEach(function(f){
  f.addEventListener('submit', function(e){ e.preventDefault(); window.location.href='thanks.html'; });
});
</script>
