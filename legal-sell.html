* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Yu Gothic", "Meiryo", sans-serif; background: #f5f6f8; color: #1a1a1a; }
/* 全屏背景大图占位 */
.legal-bg {
  position: fixed; inset: 0; z-index: 0;
  background: #eef0f4; border: 1px dashed #c8cdd6;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 12px;

  display: flex; align-items: center; justify-content: center; color: #333;
}
/* 中间内容区：标题 + 可滚动说明 */
.legal-main {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  padding: 80px 20px 120px; min-height: 100vh;
}
.legal-title { font-size: 28px; font-weight: 700; margin-bottom: 30px; }
.legal-content {
  width: 100%; max-width: 800px;
  background: #fff; border: 1px solid #c8cdd6; border-radius: 10px;
  padding: 30px; line-height: 1.8; font-size: 15px; color: #333;
  height: 420px; overflow-y: auto;
}
/* 页脚固定底部（与主站保持一致：白底 + 左侧社媒 + 居中链接） */
.site-footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  border-top: 1px solid #c8cdd6; background: #fff; padding: 14px 24px;
}
.footer-links { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 14px; }
.footer-links a { color: #555; font-size: 14px; text-decoration: none; }
.footer-copy { text-align: center; font-size: 13px; color: #777; }
.footer-socials { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); display: flex; gap: 10px; }
.social-slot {
  height: 40px; padding: 0 16px; border-radius: 20px;
  background: #e2e5ea; border: 2px dashed #9aa3b2;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #333; text-decoration: none;
}
/* DMM 专用标头模拟占位（正式接入替换官方模板，样式不可改） */

.dmm-header .dmm-logo { font-size: 17px; font-weight: 700; }
